<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=320, initial-scale=1.0">
    <title>Domino's App feat. Hatsune Miku - Making Of</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">

        <!-- STORY SECTION -->
        <section class="section-block">
            <img src="banners/story.png" class="header-banner" alt="STORY">
        </section>

        <!-- DOCUMENTARY SECTION -->
        <section class="section-block">
            <img src="banners/documentary.png" class="header-banner" alt="DOCUMENTARY">
            
            <!-- Vol. 1 -->
            <div class="doc-card">
                <img src="content/vol1.png" class="doc-img" alt="">
                <a href="#" class="play-link doc-play-btn"><img src="buttons/button1.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Vol. 2 -->
            <div class="doc-card">
                <img src="content/vol2.png" class="doc-img" alt="">
                <a href="#" class="play-link doc-play-btn"><img src="buttons/button2.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Vol. 3 -->
            <div class="doc-card">
                <img src="content/vol3.png" class="doc-img" alt="">
                <a href="#" class="play-link doc-play-btn"><img src="buttons/button3.png" class="play-btn-img" alt="Play"></a>
            </div>
        </section>

        <!-- MEMBER SECTION -->
        <section class="section-block">
            <img src="banners/members.png" class="header-banner" alt="MEMBER">
            <div class="team-grid-wrapper">
                <img src="content/teamandsupport.png" class="team-grid-img" alt="Teams & Support">
            </div>
        </section>

        <!-- SONGS SECTION -->
        <section class="section-block">
            <img src="banners/songs.png" class="header-banner" alt="SONGS">

            <!-- Song 1 -->
            <div class="song-card">
                <img src="content/song1.png" class="song-frame" alt="Song 1">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton1.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Song 2 -->
            <div class="song-card">
                <img src="content/song2.png" class="song-frame" alt="Song 2">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton2.png" class="play-btn-img" alt="Play"></a>
            </div>

            <<!-- Song 3 -->
            <div class="song-card">
                <img src="content/song3.png" class="song-frame" alt="">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton3.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Song 4 -->
            <div class="song-card">
                <img src="content/song4.png" class="song-frame" alt="">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton4.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Song 5 (Present) -->
            <div class="song-card">
                <img src="content/song5.png" class="song-frame" alt="">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton5.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Song 6 -->
            <div class="song-card">
                <img src="content/song6.png" class="song-frame" alt="Song 6">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton6.png" class="play-btn-img" alt="Play"></a>
            </div>

            <!-- Song 7 -->
            <div class="song-card">
                <img src="content/song7.png" class="song-frame" alt="Song 7">
                <a href="#" class="play-link song-play-btn"><img src="buttons/songbutton7.png" class="play-btn-img" alt="Play"></a>
            </div>

        </section>

    </div>

</body>
</html>
